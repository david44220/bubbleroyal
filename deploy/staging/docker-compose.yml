services:
  app:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    ports:
      - "8080:80"
    environment:
      APP_ENV: staging
      BUBBLE_ROYALE_SESSION_SECRET: ${BUBBLE_ROYALE_SESSION_SECRET:?copy .env.example to .env and set a local value}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-bubble_royale_staging}
      DB_USERNAME: ${MYSQL_USER:-bubble_royale}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set a local staging password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RATE_LIMIT_PATH: /var/www/html/storage/cache/rate-limits
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      MIGRATION_RETRIES: ${MIGRATION_RETRIES:-30}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bubble_royale_staging}
      MYSQL_USER: ${MYSQL_USER:-bubble_royale}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set a local staging password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set a local staging root password}
    volumes:
      - bubble-royale-staging-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 20
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server --appendonly yes; fi"]
    volumes:
      - bubble-royale-staging-redis:/data

volumes:
  bubble-royale-staging-db:
  bubble-royale-staging-redis:
