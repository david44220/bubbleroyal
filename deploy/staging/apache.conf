<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    ErrorLog ${APACHE_LOG_DIR}/bubble-royale-error.log
    CustomLog ${APACHE_LOG_DIR}/bubble-royale-access.log combined
</VirtualHost>
