<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    Alias /homepage/ /var/www/html/prototype/homepage/
    Alias /practice/ /var/www/html/prototype/practice/
    Alias /auth/ /var/www/html/prototype/auth/

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/prototype/homepage>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/prototype/practice>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/prototype/auth>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTPS} == 'on'"
    ErrorLog ${APACHE_LOG_DIR}/bubble-royale-error.log
    CustomLog ${APACHE_LOG_DIR}/bubble-royale-access.log combined
</VirtualHost>
